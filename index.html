<!doctype html>
<html lang="en" data-theme="black">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Arrowhead · GameHub</title>
    <meta name="theme-color" content="#faf8f3" />
    <link rel="stylesheet" href="/shared/v1/kit.css" />
    <link rel="stylesheet" href="/shared/v1/settings.css" />
    <link rel="stylesheet" href="css/game.css" />
  </head>
  <body>
    <main id="home" class="hub-launch">
      <header class="hub-launch-head">
        <h1>Arrowhead</h1>
        <p>Tap an arrow with a clear way out. Clear the whole picture.</p>
      </header>
      <div class="paths" role="radiogroup" aria-label="Which path">
        <button type="button" class="path-card" id="pick-simple" role="radio" data-path="simple">
          <span class="path-name">Simple Arrows</span>
          <span class="path-level" id="simple-level">Level 1</span>
        </button>
        <button type="button" class="path-card path-native" id="pick-native" role="radio" data-path="native">
          <span class="path-name">Arrowhead</span>
          <span class="path-level" id="native-level">Level 1</span>
        </button>
      </div>
      <p class="wallet"><span class="coin" aria-hidden="true"></span><span id="home-coins">0</span> coins</p>
      <div class="hub-launch-actions">
        <button type="button" class="hub-play" id="play-path">Play</button>
        <button type="button" class="hub-levels" id="levels" hidden>Levels</button>
      </div>
    </main>

    <dialog id="replay" class="replay">
      <header class="replay-head">
        <h2 id="replay-title">Levels</h2>
        <button type="button" id="replay-close" class="round" aria-label="Close">✕</button>
      </header>
      <p class="soft">Pick up where you are, or play a finished level again. Old levels pay coins the same way.</p>
      <div id="replay-levels" class="replay-levels"></div>
    </dialog>

    <section id="play" class="screen" hidden>
      <canvas id="board" aria-label="The puzzle board. Tap an arrow to send it off the board."></canvas>
      <div class="top-bar">
        <div class="top-info">
          <p class="level-label"><span id="level-name">Level 1</span> · <span id="left">0</span> left</p>
          <p class="coins-label"><span id="replay-tag" class="replay-tag" hidden>Replay</span><span class="coin" aria-hidden="true"></span><span id="coins">0</span></p>
        </div>
      </div>
      <div id="coach" class="coach" hidden>
        <p id="coach-text"></p>
        <button type="button" id="coach-ok" class="pill">Got it</button>
      </div>
      <p id="toast" class="toast" role="status"></p>
      <nav class="bottom-bar">
        <button type="button" id="undo" class="tool"><span aria-hidden="true">↶</span>Undo</button>
        <button type="button" id="hint" class="tool"><span aria-hidden="true">✦</span>Hint <small id="hint-price"></small></button>
        <button type="button" id="burn" class="tool" aria-pressed="false"><span aria-hidden="true">🔥</span>Burn <small id="burn-price"></small></button>
        <button type="button" id="fit" class="tool"><span aria-hidden="true">⤢</span>See all</button>
      </nav>
      <div id="done" class="done" hidden>
        <div class="done-card">
          <h2 id="done-title">Level complete</h2>
          <p id="done-coins" class="soft"></p>
          <button type="button" id="next" class="hub-button">Next level</button>
          <button type="button" id="done-home" class="pill done-home">Home</button>
        </div>
      </div>
    </section>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
